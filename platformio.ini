# =================================================================
# PlatformIO Configuration: Smart PDU Gateway Utama (Lantai Bawah)
# Target MCU: ESP32-S3 (ESP32-S3-DevKitC-1 / N16R8 / N8R2)
# Role: Master Gateway (Blynk + ESP-NOW Hub + WebServer + PDU Lt 1)
# =================================================================

[env:esp32s3_gateway]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

# Flash & Memory: ESP32-S3-WROOM-1-N16R8 (16MB Flash, 8MB Octal PSRAM)
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = dio_opi
board_build.flash_mode = dio
board_build.psram_type = opi

# Monitor & Debugging
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

# Partition Scheme: Dual OTA + LittleFS Storage
board_build.filesystem = littlefs

# Compiler Flags & S3 Optimizations
build_flags = 
    -D CORE_DEBUG_LEVEL=0
    -D BOARD_HAS_PSRAM
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=0
    -mfix-esp32-psram-cache-issue

# Dependencies
lib_deps = 
    blynkkk/Blynk @ ^1.3.2
    mandulaj/PZEM-004T-v30 @ ^1.1.2
    mathieucarbou/ESPAsyncWebServer @ ^3.6.0
    mathieucarbou/AsyncTCP @ ^3.3.2
    bblanchon/ArduinoJson @ ^7.0.4
